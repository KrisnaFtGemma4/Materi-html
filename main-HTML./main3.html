<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font face</title>
</head>
<body>
<p style="border: 2px solid yellow; text-align: left;"><font face="lucida console" style="color: darkorange;">Aku cambridge</font></p>
<p style="border: 2px solid red; text-align: center;"><font face="Courier New" style="color: yellow;">Aku cambridge</font></p>
<p style="border: 2px solid cyan; text-align: right;"><font face="algerian" style="color: blueviolet;">Aku Cambridge</font></p>
</body>
</html>
